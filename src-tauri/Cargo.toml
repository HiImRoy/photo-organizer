[package]
name = "photo-organizer"
version = "0.1.0"
description = "Local-first photo library and safe organization planner"
authors = ["PhotoOrganizer contributors"]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
default-run = "photo-organizer"

[lib]
name = "photo_organizer_lib"
crate-type = ["rlib"]

[[bin]]
name = "photo-organizer"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "semantic-benchmark"
path = "src/bin/semantic-benchmark.rs"

[target.'cfg(target_env = "msvc")'.build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-log"]

[dependencies]
base64 = "0.22"
blake3 = "1.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.6"
log = "0.4"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-24"] }
parking_lot = "0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-log = { version = "2", optional = true }
thiserror = "2"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
uuid = { version = "1", features = ["serde", "v4"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
